global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: netdevops-core

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: netdevops-health-monitor
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ["health-monitor:8000"]